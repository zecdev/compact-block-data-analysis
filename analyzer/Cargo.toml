[package]
name = "compact-block-analyzer"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"
description = "Analyze bandwidth impact of transparent data in Zcash compact blocks"
repository = "https://github.com/yourusername/compact-block-analyzer"

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.11"
prost = "0.12"
prost-types = "0.12"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
csv = "1.3"
anyhow = "1.0"
rand = "0.8"
clap = { version = "4.0", features = ["derive"] }

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
tempfile = "3.0"
